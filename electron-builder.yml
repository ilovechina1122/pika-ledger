appId: com.pika.ledger
productName: 多宝记账
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
npmRebuild: true
win:
  target:
    - nsis
    - zip
  icon: build/icon.ico
  artifactName: pika-ledger-${version}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - zh_CN
  shortcutName: 多宝记账
  artifactName: pika-ledger-${version}-setup.${ext}
mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.finance
